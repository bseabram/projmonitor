{% extends "core/base.html" %}
{% block title %}Decompor Tarefa{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:600px">
  <h4>Adicionar Subtarefa</h4>
  <p class="text-muted">Tarefa pai: <strong>{{ tarefa.titulo }}</strong></p>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Criar subtarefa</button>
    <a href="{% url 'detalhe_projeto' tarefa.projeto.id %}" class="btn btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
